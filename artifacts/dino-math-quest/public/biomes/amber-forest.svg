<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#skyAmber)"/>
  <!-- Sun glow -->
  <circle cx="200" cy="60" r="50" fill="#fbbf24" opacity="0.4"/>
  <circle cx="200" cy="60" r="34" fill="#f59e0b" opacity="0.5"/>
  <circle cx="200" cy="60" r="22" fill="#fbbf24"/>
  <!-- Ground -->
  <ellipse cx="200" cy="290" rx="220" ry="50" fill="#92400e" opacity="0.6"/>
  <rect x="0" y="260" width="400" height="40" fill="#78350f" opacity="0.5"/>
  <!-- Amber tree left back -->
  <rect x="48" y="100" width="18" height="130" fill="url(#trunkGrad)"/>
  <ellipse cx="57" cy="90" rx="42" ry="52" fill="#d97706" opacity="0.85"/>
  <ellipse cx="57" cy="80" rx="30" ry="38" fill="#f59e0b" opacity="0.9"/>
  <!-- Amber tree right back -->
  <rect x="322" y="110" width="18" height="120" fill="url(#trunkGrad)"/>
  <ellipse cx="331" cy="100" rx="40" ry="48" fill="#b45309" opacity="0.85"/>
  <ellipse cx="331" cy="90" rx="28" ry="36" fill="#d97706" opacity="0.9"/>
  <!-- Amber tree center left -->
  <rect x="130" y="90" width="22" height="140" fill="url(#trunkGrad)"/>
  <ellipse cx="141" cy="76" rx="50" ry="62" fill="#f59e0b" opacity="0.9"/>
  <ellipse cx="141" cy="62" rx="36" ry="44" fill="#fbbf24" opacity="0.95"/>
  <!-- Amber tree center right -->
  <rect x="248" y="95" width="22" height="135" fill="url(#trunkGrad)"/>
  <ellipse cx="259" cy="80" rx="48" ry="58" fill="#d97706" opacity="0.9"/>
  <ellipse cx="259" cy="68" rx="34" ry="42" fill="#f59e0b"/>
  <!-- Falling amber leaves -->
  <ellipse cx="80" cy="140" rx="6" ry="4" fill="#fbbf24" opacity="0.8" transform="rotate(-30 80 140)"/>
  <ellipse cx="160" cy="160" rx="5" ry="3" fill="#f59e0b" opacity="0.8" transform="rotate(20 160 160)"/>
  <ellipse cx="300" cy="130" rx="6" ry="4" fill="#fbbf24" opacity="0.8" transform="rotate(-15 300 130)"/>
  <ellipse cx="240" cy="180" rx="5" ry="3" fill="#d97706" opacity="0.8" transform="rotate(35 240 180)"/>
  <ellipse cx="120" cy="200" rx="4" ry="3" fill="#fbbf24" opacity="0.8" transform="rotate(-20 120 200)"/>
  <ellipse cx="340" cy="200" rx="5" ry="3" fill="#f59e0b" opacity="0.8" transform="rotate(10 340 200)"/>
  <!-- Amber glow pools on ground -->
  <ellipse cx="100" cy="270" rx="30" ry="8" fill="#fbbf24" opacity="0.3"/>
  <ellipse cx="280" cy="272" rx="28" ry="7" fill="#f59e0b" opacity="0.3"/>
  <!-- Sparkle dots -->
  <circle cx="170" cy="110" r="3" fill="#fde68a" opacity="0.9"/>
  <circle cx="230" cy="120" r="2.5" fill="#fde68a" opacity="0.9"/>
  <circle cx="90" cy="170" r="2" fill="#fde68a" opacity="0.8"/>
  <circle cx="310" cy="155" r="3" fill="#fde68a" opacity="0.8"/>
</svg>
