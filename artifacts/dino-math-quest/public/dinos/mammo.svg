<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" stroke="#503B32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Far legs and far tusk establish depth without introducing new colors. -->
  <path fill="#B96C47" opacity="0.72" d="M35 80 L49 80 L49 114 L35 114 Q31 110 35 106 Z"/>
  <path fill="#B96C47" opacity="0.72" d="M81 80 L95 80 L95 114 L81 114 Q77 110 81 106 Z"/>
  <path fill="#FFF4D5" opacity="0.72" d="M34 62
    Q22 71 17 84 Q13 94 20 99
    Q19 91 25 82 Q31 73 39 70 Z"/>

  <!-- Bulky body outline with exactly five rounded, descending back peaks. -->
  <path fill="#B96C47" d="M35 31
    Q40 20 46 31 Q51 24 57 35
    Q62 28 68 39 Q73 32 79 43
    Q84 36 90 47
    Q105 50 110 61
    Q114 69 110 80
    L108 86 L38 86
    Q31 80 30 70
    Q28 55 35 31 Z"/>

  <!-- Near legs, all four pads share the y=114 ground line. -->
  <path fill="#B96C47" d="M58 80 L72 80 L72 114 L58 114 Q54 110 58 106 Z"/>
  <path fill="#B96C47" d="M104 80 L118 80 L118 114 L104 114 Q100 110 104 106 Z"/>

  <!-- Hanging tail, short and unmistakably not a club. -->
  <path fill="#B96C47" d="M109 65 Q116 70 113 80 L109 77 Q111 71 106 69 Z"/>

  <!-- Long even-width trunk with a gentle forward S and up-curled tip. -->
  <path fill="#B96C47" d="M35 52
    Q27 58 22 68 Q14 78 10 90
    Q9 98 16 102 Q22 106 25 99
    Q27 95 25 90 Q26 80 22 68
    Q24 59 40 54 Z"/>

  <!-- Near tusk repeats the far tusk's down-forward-up curl geometry. -->
  <path fill="#FFF4D5" d="M39 66
    Q27 75 22 88 Q18 98 25 103
    Q24 95 30 86 Q36 77 44 74 Z"/>

  <!-- Belly fur fringe and narrow cream under-edge. -->
  <path fill="#B96C47" d="M42 80 L50 90 L57 81 L65 91 L73 81 L81 90 L90 80 L96 86 L96 92 L42 92 Z"/>
  <path fill="#FFF4D5" d="M43 88 L50 94 L57 87 L65 95 L73 87 L81 94 L89 87 L94 91 L94 95 L43 95 Z"/>

  <!-- Warm open eye, catchlight notch, and exactly three brow-fringe points. -->
  <circle cx="39" cy="47" r="5" fill="#FFF4D5"/>
  <circle cx="39" cy="47" r="3.5" fill="#503B32" stroke="none"/>
  <circle cx="37.5" cy="45.5" r="1.1" fill="#FFF4D5" stroke="none"/>
  <path fill="#B96C47" d="M31 38 L36 46 L40 38 L44 46 L49 38 L47 50 L32 50 Z"/>
</svg>
