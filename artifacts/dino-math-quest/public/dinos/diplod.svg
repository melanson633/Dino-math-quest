<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Long tail -->
  <path d="M90 82 Q105 80 116 72 Q120 64 114 62 Q108 62 106 68 Q100 76 90 78" fill="#8fbc5a" stroke="#3d6620" stroke-width="3" stroke-linejoin="round"/>
  <!-- Body -->
  <ellipse cx="66" cy="80" rx="30" ry="20" fill="#8fbc5a" stroke="#3d6620" stroke-width="3"/>
  <!-- Legs -->
  <rect x="44" y="92" width="11" height="18" rx="5" fill="#7daa4a" stroke="#3d6620" stroke-width="2.5"/>
  <rect x="58" y="94" width="11" height="16" rx="5" fill="#7daa4a" stroke="#3d6620" stroke-width="2.5"/>
  <rect x="72" y="94" width="11" height="16" rx="5" fill="#7daa4a" stroke="#3d6620" stroke-width="2.5"/>
  <rect x="84" y="92" width="11" height="18" rx="5" fill="#7daa4a" stroke="#3d6620" stroke-width="2.5"/>
  <!-- Long neck -->
  <path d="M38 70 Q28 56 22 38 Q18 22 22 16" fill="none" stroke="#3d6620" stroke-width="16" stroke-linecap="round"/>
  <path d="M38 70 Q28 56 22 38 Q18 22 22 16" fill="none" stroke="#8fbc5a" stroke-width="11" stroke-linecap="round"/>
  <!-- Head (small) -->
  <ellipse cx="22" cy="14" rx="10" ry="7" fill="#8fbc5a" stroke="#3d6620" stroke-width="2.5"/>
  <!-- Eye -->
  <circle cx="18" cy="12" r="3" fill="white" stroke="#3d6620" stroke-width="1.5"/>
  <circle cx="18" cy="12" r="1.5" fill="#1a1a1a"/>
  <!-- Nostril -->
  <circle cx="14" cy="16" r="1.2" fill="#3d6620"/>
  <!-- Smile -->
  <path d="M14 18 Q18 22 24 18" fill="none" stroke="#3d6620" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Back bumps -->
  <circle cx="50" cy="62" r="5" fill="#a0cc6a" stroke="#3d6620" stroke-width="2"/>
  <circle cx="64" cy="60" r="5" fill="#a0cc6a" stroke="#3d6620" stroke-width="2"/>
  <circle cx="78" cy="62" r="5" fill="#a0cc6a" stroke="#3d6620" stroke-width="2"/>
</svg>
