learningAreas:
  - id: math
    name: Math Quest
    shortLabel: Math
    icon: "🔢"
    status: playable
    description: Count, add, subtract, shapes, and patterns with Tri.
    difficultyPace: quicker
    accent: "#22c55e"
  - id: spelling
    name: Spelling Adventure
    shortLabel: Words
    icon: "🔤"
    status: playable
    description: Simple words, family names, letter sounds, and phonics.
    difficultyPace: quicker
    accent: "#38bdf8"
  - id: speech
    name: Speech Songs
    shortLabel: Say It
    icon: "🎵"
    status: scaffold
    description: Gentle rhythm, syllable breaks, and help-the-dino phrases.
    difficultyPace: gentle
    accent: "#f472b6"
  - id: music
    name: Music Den
    shortLabel: Music
    icon: "🥁"
    status: scaffold
    description: Short songs, beat games, and confidence-building sounds.
    difficultyPace: gentle
    accent: "#f59e0b"
speechMoments:
  retryLimit: 1
  positiveOnly: true
  starterPrompts:
    - id: l-lion
      focusSound: L
      text: La-la-lion
      rhythm: ["la", "la", "lion"]
    - id: w-wow
      focusSound: W
      text: Wow, we won
      rhythm: ["wow", "we", "won"]
    - id: w-love
      focusSound: W + L
      text: We love Dino
      rhythm: ["we", "love", "di-no"]
    - id: l-little
      focusSound: L
      text: Little lion
      rhythm: ["lit-tle", "li-on"]
    - id: w-walk
      focusSound: W
      text: Max walks with me
      rhythm: ["max", "walks", "with me"]
    - id: max-name
      focusSound: M
      text: Max says mama
      rhythm: ["max", "says", "ma-ma"]
musicMoments:
  - id: count-with-tri
    learningArea: math
    style: call-and-response
    title: Count with Tri
